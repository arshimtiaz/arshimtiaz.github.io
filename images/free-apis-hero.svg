<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Free APIs hero graphic">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08101d"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="210" cy="150" r="170" fill="url(#glowA)"/>
  <circle cx="930" cy="470" r="210" fill="url(#glowB)"/>

  <g opacity="0.16" stroke="#334155" stroke-width="1">
    <path d="M0 150 H1200"/>
    <path d="M0 315 H1200"/>
    <path d="M0 480 H1200"/>
    <path d="M180 0 V630"/>
    <path d="M600 0 V630"/>
    <path d="M1020 0 V630"/>
  </g>

  <rect x="70" y="86" width="1060" height="458" rx="30" fill="#0f172a" fill-opacity="0.56" stroke="#1e293b" stroke-width="2"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace">
    <text x="120" y="176" font-size="22" fill="#93c5fd">blog.post</text>
    <text x="120" y="258" font-size="64" fill="#f8fafc">Free APIs</text>
    <text x="120" y="328" font-size="64" fill="#f8fafc">Are Worth</text>
    <text x="120" y="398" font-size="64" fill="#f8fafc">Using</text>
    <text x="120" y="452" font-size="22" fill="#cbd5e1">Borrow the working part. Build the useful bit.</text>
    <text x="120" y="488" font-size="18" fill="#94a3b8">Real services. Small scripts. Better projects.</text>
  </g>

  <g stroke="#1f2a44" stroke-width="1">
    <rect x="730" y="146" width="300" height="88" rx="18" fill="url(#panel)"/>
    <rect x="730" y="272" width="300" height="88" rx="18" fill="url(#panel)"/>
    <rect x="730" y="398" width="300" height="88" rx="18" fill="url(#panel)"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace">
    <text x="760" y="184" font-size="20" fill="#e2e8f0">Weather API</text>
    <text x="760" y="214" font-size="14" fill="#94a3b8">forecast, rain, temperature</text>

    <text x="760" y="310" font-size="20" fill="#e2e8f0">GitHub API</text>
    <text x="760" y="340" font-size="14" fill="#94a3b8">repos, releases, issues</text>

    <text x="760" y="436" font-size="20" fill="#e2e8f0">Ollama API</text>
    <text x="760" y="466" font-size="14" fill="#94a3b8">local models over HTTP</text>
  </g>

  <g stroke="url(#accent)" stroke-width="3" fill="none" opacity="0.85">
    <path d="M620 315 H700"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace" fill="#94a3b8" font-size="12" opacity="0.5">
    <text x="1130" y="610" text-anchor="end">https://arshimtiaz.github.io</text>
  </g>
</svg>
